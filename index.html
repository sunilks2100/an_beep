
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#22c55e">
  <title>Double Beep Timer</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }
    button {
      padding: 14px 28px;
      margin: 10px;
      font-size: 18px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    #start { background: #22c55e; }
    #stop { background: #ef4444; color: white; }
    #status { margin-top: 25px; }
  </style>
</head>
<body>
  <h1>Double Beep Timer</h1>
  <p>Play two beeps every 30 minutes.</p>

  <button id="start">Start</button>
  <button id="stop">Stop</button>

  <p id="status">Timer stopped</p>
  <p id="countdown"></p>

  <audio id="beepAudio" src="./double-beep-loop.wav"
         preload="auto"></audio>

  <script>
    const audio = document.getElementById("beepAudio");
    const status = document.getElementById("status");
    const countdown = document.getElementById("countdown");

    const INTERVAL_MS = 30 * 60 * 1000;

    let timerId = null;
    let displayId = null;
    let nextBeepTime = 0;
    let running = false;

    async function playBeep() {
      try {
        audio.currentTime = 0;
        await audio.play();
      } catch (error) {
        status.textContent =
          "Could not play audio. Please press Start again.";
        stopTimer();
      }
    }

    function stopTimer() {
      running = false;
      clearTimeout(timerId);
      clearInterval(displayId);
      timerId = null;
      displayId = null;
      audio.pause();
      audio.currentTime = 0;
      status.textContent = "Timer stopped";
      countdown.textContent = "";
    }

    function scheduleNextBeep() {
      if (!running) return;

      const remaining = nextBeepTime - Date.now();

      if (remaining <= 0) {
        playBeep();
        nextBeepTime = Date.now() + INTERVAL_MS;
      }

      timerId = setTimeout(
        scheduleNextBeep,
        Math.max(1000, nextBeepTime - Date.now())
      );
    }

    function updateCountdown() {
      if (!running) return;

      const remaining = Math.max(0, nextBeepTime - Date.now());
      const totalSeconds = Math.ceil(remaining / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;

      countdown.textContent =
        `Next beep in ${minutes}m ${seconds}s`;
    }

    document.getElementById("start").addEventListener("click", async () => {
      if (running) return;

      running = true;
      status.textContent = "Playing first beep...";
      await playBeep();

      if (!running) return;

      nextBeepTime = Date.now() + INTERVAL_MS;
      status.textContent = "Timer running";
      timerId = setTimeout(scheduleNextBeep, INTERVAL_MS);
      displayId = setInterval(updateCountdown, 1000);
      updateCountdown();
    });

    document.getElementById("stop").addEventListener("click", stopTimer);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>
</body>
</html>
